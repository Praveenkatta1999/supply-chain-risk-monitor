[project]
name = "scrm"
version = "0.1.0"
description = "Multi-agent supply chain risk monitor over GDELT in BigQuery."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk>=2.11,<3",
    "google-cloud-bigquery>=3.46,<4",
    "pydantic>=2.13,<3",
    "fastapi>=0.141,<1",
    "uvicorn>=0.54,<1",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "pyarrow>=25,<26",
    "pytest>=9.1,<10",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
